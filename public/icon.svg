<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#FEF3C7"/>

  <!-- Dog face outline - neobrutalism style -->
  <g transform="translate(56, 80)">
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="160" ry="150" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>

    <!-- Left ear -->
    <path d="M60 120 Q30 20 80 60 Q100 80 90 130" fill="#F472B6" stroke="#000000" stroke-width="6"/>

    <!-- Right ear -->
    <path d="M340 120 Q370 20 320 60 Q300 80 310 130" fill="#F472B6" stroke="#000000" stroke-width="6"/>

    <!-- Left eye -->
    <circle cx="140" cy="150" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
    <circle cx="145" cy="145" r="15" fill="#1F2937"/>
    <circle cx="150" cy="140" r="5" fill="#FFFFFF"/>

    <!-- Right eye -->
    <circle cx="260" cy="150" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
    <circle cx="265" cy="145" r="15" fill="#1F2937"/>
    <circle cx="270" cy="140" r="5" fill="#FFFFFF"/>

    <!-- Nose -->
    <ellipse cx="200" cy="220" rx="35" ry="25" fill="#1F2937" stroke="#000000" stroke-width="4"/>
    <ellipse cx="200" cy="215" rx="10" ry="6" fill="#4B5563"/>

    <!-- Mouth -->
    <path d="M200 245 Q160 280 150 260" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 245 Q240 280 250 260" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

    <!-- Tongue -->
    <ellipse cx="200" cy="285" rx="20" ry="30" fill="#F472B6" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- "Age" badge - neobrutalism style -->
  <g transform="translate(320, 340)">
    <rect x="0" y="0" width="140" height="100" rx="0" fill="#3B82F6" stroke="#000000" stroke-width="6" transform="translate(6, 6)"/>
    <rect x="0" y="0" width="140" height="100" rx="0" fill="#FBBF24" stroke="#000000" stroke-width="6"/>
    <text x="70" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="#000000">AGE</text>
  </g>
</svg>
