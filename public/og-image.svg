<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FEF3C7"/>

  <!-- Decorative elements - neobrutalism style -->
  <rect x="50" y="50" width="120" height="120" fill="#F472B6" stroke="#000" stroke-width="4" transform="rotate(15, 110, 110)"/>
  <rect x="1030" y="450" width="100" height="100" fill="#34D399" stroke="#000" stroke-width="4" transform="rotate(-10, 1080, 500)"/>
  <circle cx="150" cy="500" r="40" fill="#3B82F6" stroke="#000" stroke-width="4"/>
  <circle cx="1050" cy="130" r="50" fill="#FBBF24" stroke="#000" stroke-width="4"/>

  <!-- Main card -->
  <g transform="translate(200, 100)">
    <!-- Shadow -->
    <rect x="12" y="12" width="800" height="430" fill="#000"/>
    <!-- Card -->
    <rect x="0" y="0" width="800" height="430" fill="#FFFFFF" stroke="#000" stroke-width="6"/>

    <!-- Dog illustration (simplified) -->
    <g transform="translate(50, 60) scale(0.6)">
      <!-- Head -->
      <ellipse cx="200" cy="180" rx="160" ry="150" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>
      <!-- Left ear -->
      <path d="M60 120 Q30 20 80 60 Q100 80 90 130" fill="#F472B6" stroke="#000000" stroke-width="6"/>
      <!-- Right ear -->
      <path d="M340 120 Q370 20 320 60 Q300 80 310 130" fill="#F472B6" stroke="#000000" stroke-width="6"/>
      <!-- Left eye -->
      <circle cx="140" cy="150" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
      <circle cx="145" cy="145" r="15" fill="#1F2937"/>
      <circle cx="150" cy="140" r="5" fill="#FFFFFF"/>
      <!-- Right eye -->
      <circle cx="260" cy="150" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
      <circle cx="265" cy="145" r="15" fill="#1F2937"/>
      <circle cx="270" cy="140" r="5" fill="#FFFFFF"/>
      <!-- Nose -->
      <ellipse cx="200" cy="220" rx="35" ry="25" fill="#1F2937" stroke="#000000" stroke-width="4"/>
      <!-- Mouth -->
      <path d="M200 245 Q160 280 150 260" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
      <path d="M200 245 Q240 280 250 260" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
      <!-- Tongue -->
      <ellipse cx="200" cy="285" rx="20" ry="30" fill="#F472B6" stroke="#000000" stroke-width="4"/>
    </g>

    <!-- Text content -->
    <text x="400" y="100" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="#1F2937" text-anchor="start">TrueDogAge</text>

    <text x="400" y="170" font-family="Arial, sans-serif" font-size="28" fill="#4B5563" text-anchor="start">Calculate your dog's</text>
    <text x="400" y="210" font-family="Arial, sans-serif" font-size="28" fill="#4B5563" text-anchor="start">real age in human years</text>

    <!-- Example calculation badge -->
    <g transform="translate(400, 250)">
      <rect x="6" y="6" width="340" height="120" fill="#000"/>
      <rect x="0" y="0" width="340" height="120" fill="#3B82F6" stroke="#000" stroke-width="4"/>
      <text x="170" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF" text-anchor="middle">5 dog years =</text>
      <text x="170" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#FBBF24" text-anchor="middle">57 human years</text>
    </g>
  </g>

  <!-- Website URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#1F2937" text-anchor="middle">truedogage.com</text>
</svg>
